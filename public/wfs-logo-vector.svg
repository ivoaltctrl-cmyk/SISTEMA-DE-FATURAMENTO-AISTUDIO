      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800;900&amp;family=Inter:wght@700;800&amp;display=swap');
      .wfs-red { fill: #E31B23; }
      .wfs-txt { font-family: 'Plus Jakarta Sans', 'Arial Black', sans-serif; font-weight: 900; fill: #E31B23; }
      .sats-txt { font-family: 'Inter', 'Arial', sans-serif; font-weight: 800; fill: #E31B23; letter-spacing: 5px; }
    </style>
  </defs>

  <!-- Group for Logo -->
  <g transform="translate(80, 80)">
    <!-- Emblem -->
    <g transform="translate(50, 40) scale(1.15)">
