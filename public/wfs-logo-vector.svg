        C 210 220 150 280 150 355
        C 150 430 210 490 285 490
        C 345 490 395 450 412 395
        C 390 425 345 445 295 445
        C 240 445 195 400 195 345
        C 195 295 235 252 285 248
        L 285 220 Z
      " />

      <!-- Red core swirl arc -->
      <path class="wfs-red" d="
        M 270 240
        C 215 240 170 285 170 340
        C 170 395 215 440 270 440
        C 320 440 362 402 368 355
        C 345 382 310 400 270 400
        C 235 400 205 372 205 338
        C 205 305 232 278 265 278
        C 285 278 302 288 312 302
        C 305 265 290 240 270 240 Z
      " />
    </g>

    <!-- Wordmark wfs -->
    <text x="670" y="375" class="wfs-txt" font-size="290" letter-spacing="-8px">wfs</text>

    <!-- Subtitle A SATS COMPANY -->
    <text x="680" y="465" class="sats-txt" font-size="42" font-weight="800">A SATS COMPANY</text>
  </g>
</svg>