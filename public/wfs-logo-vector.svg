        C 330 70 420 160 420 270
        C 420 380 330 470 220 470
        C 110 470 20 380 20 270
        C 20 215 42 165 78 128
        C 70 148 65 170 65 195
        C 65 295 145 375 245 375
        C 345 375 425 295 425 195
        C 425 135 395 85 350 55
        C 315 75 265 70 220 70 Z
      " opacity="0" />

      <!-- Exact Emblem geometry replicating Imagem1.png -->
      <!-- Outer crescent 1 (Bottom and Left arc) -->
      <path class="wfs-red" d="
        M 175 148
        C 105 180 60 250 60 330
        C 60 445 152 538 268 538
        C 380 538 472 450 475 338
        C 445 425 365 488 270 488
        C 178 488 105 415 105 322
        C 105 252 145 192 205 162
        C 195 157 185 152 175 148 Z
      " />

      <!-- Crescent 2 (Top and Right outer blade) -->
