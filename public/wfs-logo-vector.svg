      <!-- Center Dynamic Swirl Ring (The iconic vortex in WFS logo) -->
      <path class="wfs-red" fill-rule="evenodd" d="
        M 268 150
        C 378 150 468 240 468 350
        C 468 460 378 550 268 550
        C 158 550 68 460 68 350
        C 68 285 100 228 148 192
        C 132 215 122 244 122 275
        C 122 360 190 430 275 430
        C 360 430 430 360 430 275
        C 430 215 395 165 345 142
        C 322 147 296 150 268 150 Z

