    <path class="logo-red" d="M260,160 C215.8,160 180,195.8 180,240 C180,284.2 215.8,320 260,320 C290,320 316,303 328,278 C312,284 294,287 275,287 C234,287 200,253 200,212 C200,181 219,155 246,145 C250,150 255,155 260,160 Z" />
